[project]
name = "gear-locker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kschooley", email = "koh.schooley@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
]

[project.scripts]
gear-locker = "gear_locker:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
